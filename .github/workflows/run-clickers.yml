name: Run 100x Automation Engines

on:
  workflow_dispatch: # Allows you to manually trigger it with a single click

jobs:
  sequential-runner:
    runs-on: ubuntu-latest # Runs everything safely inside a single machine

    steps:
      - name: Checkout automation code repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install playwright asyncio

      - name: Patch Ubuntu 24.04 Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libgbm1 libnspr4 libnss3 libnss3-tools libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libasound2-plugins

      - name: Install Playwright Chromium Binary
        run: |
          playwright install chromium

      - name: Execute 100 Clicker Instances
        run: |
          echo "🚀 Initiating bulk execution chain..."
          for i in {1..100}
          do
            echo "▶️ Starting instance number $i of 100..."
            python autoclicker.py &
            
            # Give each script a quick 2-second breathing room buffer before spawning the next one
            sleep 2
          done
          
          echo "⏳ All instances successfully initialized. Holding main pipeline active..."
          # Keeps the master container open so the parallel background loops can run completely
          wait
