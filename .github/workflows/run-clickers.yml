name: Run 65x Automation Engines

on:
  workflow_dispatch: # Allows you to manually trigger this rollout via the GitHub Web UI

jobs:
  parallel-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation code repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install playwright asyncio

      - name: Patch Ubuntu 24.04 Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libgbm1 libnspr4 libnss3 libnss3-tools libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libasound2-plugins

      - name: Install Playwright Chromium Binary
        run: |
          playwright install chromium

      - name: Execute 65 Clicker Instances Simultaneously
        run: |
          echo "🚀 Unleashing 65 instances smoothly into the background..."
          
          for i in {1..65}
          do
            echo "▶️ Launching parallel background process $i of 65..."
            python autoclicker.py &
            
            # Short 0.5s pause prevents a total CPU spike while launching 65 browser windows
            sleep 0.5
          done
          
          echo "⏳ All 65 background engines initialized. Holding main pipeline live..."
          # Keeps the main workflow engine alive until all background processes finish
          wait
          echo "🎉 All jobs completed successfully!"
